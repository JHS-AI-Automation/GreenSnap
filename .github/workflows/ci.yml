name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test --if-present
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          # Dummy env vars zodat build slaagt zonder echte Supabase
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-key
          TELEGRAM_BOT_TOKEN: dummy-bot-token

  smoke-test-production:
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5

    steps:
      - name: Wait for Vercel deployment
        run: sleep 90

      - name: Health check landing page
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://green-snap-rouge.vercel.app/)
          echo "Landing page status: $status"
          [ "$status" = "200" ] || exit 1

      - name: Health check login page
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://green-snap-rouge.vercel.app/login)
          echo "Login page status: $status"
          [ "$status" = "200" ] || exit 1

      - name: Smoke test /api/debug (env vars present)
        run: |
          response=$(curl -s https://green-snap-rouge.vercel.app/api/debug)
          echo "Response: $response"
          echo "$response" | grep -q '"SERVICE_ROLE_KEY_set":true' || exit 1
          echo "$response" | grep -q '"TELEGRAM_BOT_TOKEN_set":true' || exit 1

      - name: Smoke test /api/clients (DB connection)
        run: |
          response=$(curl -s https://green-snap-rouge.vercel.app/api/clients)
          echo "Response sample: ${response:0:200}"
          # Must NOT contain permission denied
          echo "$response" | grep -q "permission denied" && exit 1
          # Must be valid JSON array (starts with [)
          echo "$response" | head -c 1 | grep -q '\[' || exit 1
          echo "Clients endpoint OK"

      - name: Smoke test /api/users (DB connection)
        run: |
          response=$(curl -s https://green-snap-rouge.vercel.app/api/users)
          echo "Response sample: ${response:0:200}"
          echo "$response" | grep -q "permission denied" && exit 1
          echo "$response" | head -c 1 | grep -q '\[' || exit 1
          echo "Users endpoint OK"

      - name: Smoke test middleware redirect
        run: |
          # Onbeschermde toegang tot /dashboard moet redirecten naar /login
          location=$(curl -s -o /dev/null -w "%{redirect_url}" https://green-snap-rouge.vercel.app/dashboard)
          echo "Redirect: $location"
          echo "$location" | grep -q "/login" || exit 1
          echo "Auth redirect OK"
